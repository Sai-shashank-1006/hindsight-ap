[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: calls the real Groq and Hindsight APIs and spends credits; runs only with RUN_LIVE=1
    mysql: runs against a real MySQL server; runs only with TEST_MYSQL_URL set
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
